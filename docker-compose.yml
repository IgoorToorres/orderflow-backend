services:
  mysql:
    image: mysql:8.4
    container_name: orderflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orderflow
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mysql-test:
    image: mysql:8.4
    container_name: orderflow-mysql-test
    profiles: ['test']
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orderflow_test
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
    ports:
      - '3307:3306'
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  mysql_test_data:
